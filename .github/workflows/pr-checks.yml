name: PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: PR checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the pinned bootstrap test runner
        run: |
          python -m venv .venv-bootstrap-ci
          .venv-bootstrap-ci/bin/pip install uv==0.11.5
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - name: Check inactive connector authoring types
        run: >-
          ./node_modules/.bin/tsc --noEmit --target ES2022 --module NodeNext
          --moduleResolution NodeNext --strict --skipLibCheck
          src/lib/connector-toolchain.ts src/lib/connector-templates.ts src/lib/connector-init.ts
          src/lib/connector-python-process.ts src/lib/connector-python-probe.ts
          src/lib/connector-python-selection.ts
          src/lib/connector-environment.ts
      - run: npm test
        env:
          SUPAFLOW_TEST_UV: ${{ github.workspace }}/.venv-bootstrap-ci/bin/uv
      - run: node --test tests/publish-script.node.mjs
      - run: npm audit --omit=dev --audit-level=high
      - run: node --test .github/tests/codex-review-gate.node.mjs
